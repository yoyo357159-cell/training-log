<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Log</title><style> *{box-sizing:border-box}body{margin:0;background:#101714;color:#edf4ef;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px 16px 100px}h1{letter-spacing:2px;margin-bottom:4px}small{color:#a3b5aa}nav{display:flex;gap:6px;position:sticky;top:0;background:#101714;padding:12px 0;z-index:2}button,input,select,textarea{font:inherit;color:inherit;background:#202d26;border:1px solid #405349;border-radius:9px;padding:10px;min-width:0}button{cursor:pointer}button.active,.primary{background:#a8e6bc;color:#102218;border-color:#a8e6bc}nav button{flex:1;padding:10px 4px;font-size:14px}.panel{background:#19231e;border:1px solid #34443a;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>*{min-width:0}.grow{flex:1}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.days button{padding:12px 4px}input,textarea,select{width:100%}label{display:block;color:#b5c8bb;font-size:13px;margin-top:8px}h3{margin:0 0 8px}.set{display:grid;grid-template-columns:24px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin:7px 0}.set input{padding:9px 5px}.set button{padding:7px}.wide{width:100%;margin-top:8px}pre{white-space:pre-wrap} .muted{color:#a3b5aa;font-size:13px} .bar{height:8px;background:#a8e6bc;border-radius:5px}body.light{background:#f5f7f5;color:#17251c}body.light nav{background:#f5f7f5}body.light .panel,body.light input,body.light select,body.light textarea,body.light button:not(.primary):not(.active){background:#fff;color:#17251c;border-color:#b8c7bd}body.light small,body.light label,body.light .muted{color:#52665a}nav{flex-wrap:wrap}[hidden]{display:none!important} </style><main><h1>TRAINING LOG</h1><small>你的訓練，你的節奏。</small><div class="row"><button onclick="toggleTheme()">深淺切換</button><button onclick="logout()">登出</button></div><p id="cloudStatus" role="status">尚未登入</p><div id="login" class="panel"><label>電子郵件</label><input id="email" type="email"><label>密碼</label><input id="password" type="password"><button onclick="login(false)">登入</button> <button onclick="login(true)">註冊</button></div><nav id="nav"></nav><section id="app"></section></main><script>
const defaults=[['背為主',[['對握下拉／對握引體','6–10',3],['中背水平划船','8–12',3],['器械平胸','8–12',2],['夾胸','12–15',2],['二頭','10–12',2]]],['SQ',[['SQ','5–8',3],['腿推','10–12',3],['腿前伸','12–15',2],['腿後勾','10–15',2],['小腿','12–15',2]]],['胸為主',[['槓鈴臥推','5–8',3],['悍馬上斜推','8–12',2],['Cable 中背划船','12–15',2],['側平舉','12–15',3],['三頭過頭','10–15',2]]],['背為主',[['中立握下拉','8–12',3],['單邊啞鈴划船','8–12',3],['啞鈴上胸','8–12',2],['夾胸','12–15',2],['斜板二頭','10–12',2]]],['RDL',[['RDL','6–10',3,'80'],['腿後勾','10–15',3],['單腳腿推','10–12',3],['腿前伸','12–15',2],['小腿','12–15',2]]],['胸為主',[['悍馬胸推','8–12',3],['伏地挺身','12',2],['單邊下拉','12–15',2],['Cable 側平舉','12–15',3],['三頭下壓','10–15',2]]]];const clone=x=>JSON.parse(JSON.stringify(x));let data;try{data=JSON.parse(localStorage.getItem('training-log-v1'))}catch(e){};const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const ex=(n,t,c,w='')=>({name:n,target:t,unit:'kg',sets:Array.from({length:c},()=>({w:'',r:'',rir:''})),hint:w});const fresh=d=>({id:Date.now().toString(),date:today(),day:d,gym:'',note:'',ex:data.plans[d][1].map(a=>ex(...a))});if(!data){data={plans:clone(defaults),history:[],draft:null};data.draft=fresh(4);data.draft.date='2026-11-25';data.draft.ex=[ex('RDL','8–10',4),ex('弓箭步','來回',3),ex('Cable 單腳 RDL','',2),ex('單邊站姿小腿提踵','組數待確認',0)];data.draft.ex[1].unit='趟';data.draft.note='場館不同，調整訓練內容。弓箭步共3趟。'}data.weights=data.weights||[];let page=0,pday=0,trend='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){if(!session)return;try{localStorage.setItem('training-log-'+session.user.id,JSON.stringify(data))}catch(e){document.getElementById('status')?.remove();let x=document.createElement('p');x.id='status';x.textContent='本機儲存失敗，請匯出備份。';document.querySelector('main').prepend(x)}}function go(p){page=p;render()}function change(k,v){data.draft[k]=v;persist()}function choose(d){if(confirm('以選定課表建立新訓練？未儲存的草稿會被取代。')){data.draft=fresh(d);persist();render()}}function update(i,k,v){data.draft.ex[i][k]=v;persist()}function setval(i,j,k,v){data.draft.ex[i].sets[j][k]=v;persist()}function mutate(fn){fn();persist();render();if(page===3)syncPlans()}async function save(){if(!session)return alert('請先登入');if(!data.draft.date)return alert('請填日期');let i=data.history.findIndex(x=>x.id===data.draft.id);if(i<0)data.history.push(clone(data.draft));else data.history[i]=clone(data.draft);persist();await syncWorkout(data.draft);go(1)}function edit(i){if(confirm('載入此紀錄並取代目前草稿？')){data.draft=clone(data.history[i]);persist();go(0)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='training-log-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){try{let x=JSON.parse(await f.text());if(!Array.isArray(x.plans)||x.plans.length!==6||!Array.isArray(x.history)||!x.draft||!Array.isArray(x.draft.ex))throw Error();if(confirm('匯入會取代目前資料，確定？')){alert("雲端版暫不支援覆蓋匯入，請保留備份")}}catch(e){alert('備份格式不正確')}}function render(){document.querySelector('#nav').innerHTML=['今日訓練','歷史紀錄','訓練趨勢','課表管理','體重'].map((n,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${n}</button>`).join('');let d=data.draft,h='';if(page===0){h=`<div class="days">${data.plans.map((p,i)=>`<button class="${d.day===i?'active':''}" onclick="choose(${i})">D${i+1}<br>${esc(p[0])}</button>`).join('')}</div><div class="row"><div class="grow"><label>日期</label><input type="date" value="${esc(d.date)}" onchange="change('date',this.value)"></div><div class="grow"><label>場館</label><input value="${esc(d.gym)}" oninput="change('gym',this.value)" placeholder="健身房"></div></div><h2>D${d.day+1} 實際訓練</h2>`;d.ex.forEach((e,i)=>{let prev=data.history.filter(x=>x.id!==d.id&&x.gym===d.gym).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(x=>x.ex.filter(y=>y.name===e.name&&y.unit===e.unit&&(y.equipment||'')===(e.equipment||'')).map(y=>({date:x.date,e:y})))[0];h+=`<div class="panel"><div class="row"><input class="grow" value="${esc(e.name)}" onchange="update(${i},'name',this.value)"><button onclick="mutate(()=>data.draft.ex.splice(${i},1))">刪除</button></div><div class="muted">目標 ${esc(e.target)} ${e.hint?'｜參考 '+esc(e.hint)+' kg':''}</div>${prev?`<p class="muted">上次同場館 ${esc(prev.date)}：${prev.e.sets.map(s=>esc(s.w||'—')+' × '+esc(s.r||'—')).join(' / ')}</p>`:''}<label>器材名稱（同場館不同器材請分開命名）</label><input value="${esc(e.equipment||'')}" onchange="update(${i},'equipment',this.value);render()"><label>重量單位／紀錄方式</label><select onchange="update(${i},'unit',this.value);render()">${['kg','lb','自體重量','輔助重量','趟'].map(u=>`<option ${e.unit===u?'selected':''}>${u}</option>`).join('')}</select><div class="set muted"><span>組</span><span>重量</span><span>次數／趟</span><span>RIR</span><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span>${['w','r','rir'].map(k=>`<input inputmode="decimal" value="${esc(s[k])}" placeholder="—" oninput="setval(${i},${j},'${k}',this.value)">`).join('')}<button onclick="mutate(()=>data.draft.ex[${i}].sets.splice(${j},1))">−</button></div>`).join('')}<button class="wide" onclick="mutate(()=>data.draft.ex[${i}].sets.push({w:'',r:'',rir:''}))">＋ 增加一組</button></div>`});h+=`<button class="wide" onclick="mutate(()=>data.draft.ex.push(ex('新動作','',1)))">＋ 新增動作</button><label>訓練備註</label><textarea rows="3" oninput="change('note',this.value)">${esc(d.note)}</textarea><button class="primary wide" onclick="save()">儲存本次訓練</button>`}else if(page===1){h='<h2>歷史紀錄</h2>'+ (data.history.length?'':'<p>尚無已儲存的訓練。</p>');data.history.map((x,i)=>({x,i})).sort((a,b)=>b.x.date.localeCompare(a.x.date)).forEach(({x,i})=>{h+=`<div class="panel"><h3>${esc(x.date)} · D${x.day+1}</h3><small>${esc(x.gym||'未填場館')}</small>${x.ex.map(e=>`<p>${esc(e.name)}<br><small>${e.sets.map(s=>esc(s.w||'—')+' '+esc(e.unit)+' × '+esc(s.r||'—')+(s.rir?' / RIR '+esc(s.rir):'')).join('；')||'組數未填'}</small></p>`).join('')}<p>${esc(x.note)}</p><div class="row"><button onclick="edit(${i})">編輯</button><button onclick="if(confirm('刪除這筆紀錄？'))deleteWorkout(${i})">刪除</button></div></div>`})}else if(page===2){let rows=data.history.flatMap(x=>x.ex.map(e=>({x,e,key:JSON.stringify([e.name,x.gym,e.equipment||'',e.unit])})));let keys=[...new Set(rows.map(r=>r.key))];if(!keys.includes(trend))trend=keys[0]||'';h='<h2>訓練趨勢</h2><p class="muted">依動作、場館及單位分開比較；僅統計已填數字的重量與次數。</p>';if(!keys.length)h+='<p>儲存訓練後即可查看。</p>';else{h+=`<select onchange="trend=this.value;render()">${keys.map(k=>`<option value="${esc(k)}" ${k===trend?'selected':''}>${esc(JSON.parse(k).join(' · '))}</option>`).join('')}</select>`;let r=rows.filter(r=>r.key===trend).sort((a,b)=>a.x.date.localeCompare(b.x.date)).map(({x,e})=>({date:x.date,sets:e.sets.filter(s=>s.w.trim()!==''&&s.r.trim()!==''&&Number.isFinite(+s.w)&&Number.isFinite(+s.r))}));let max=Math.max(1,...r.flatMap(a=>a.sets.map(s=>+s.w)));h+=r.map(a=>`<div class="panel">${esc(a.date)}${a.sets.length?`<p>最高重量 ${Math.max(...a.sets.map(s=>+s.w))}｜訓練量 ${a.sets.reduce((n,s)=>n+s.w*s.r,0)}</p><div class="bar" style="width:${Math.max(...a.sets.map(s=>+s.w))/max*100}%"></div>`:'<p>尚無完整重量與次數</p>'}</div>`).join('')}}else if(page===4){h=weightPage()}else{h=`<h2>理想課表</h2><div class="days">${data.plans.map((p,i)=>`<button class="${pday===i?'active':''}" onclick="pday=${i};render()">D${i+1} ${esc(p[0])}</button>`).join('')}</div><p class="muted">修改只影響未來載入的課表。</p>`;data.plans[pday][1].forEach((a,i)=>{h+=`<div class="panel"><label>動作</label><input value="${esc(a[0])}" onchange="plan(${i},0,this.value)"><div class="row"><div class="grow"><label>目標次數</label><input value="${esc(a[1])}" onchange="plan(${i},1,this.value)"></div><div class="grow"><label>組數</label><input type="number" min="0" max="30" value="${a[2]}" onchange="plan(${i},2,Math.max(0,Math.min(30,Math.floor(+this.value)||0)))"></div><div class="grow"><label>參考 kg</label><input value="${esc(a[3]||'')}" onchange="plan(${i},3,this.value)"></div></div><button onclick="mutate(()=>data.plans[pday][1].splice(${i},1))">刪除</button></div>`});h+=`<button class="wide" onclick="mutate(()=>data.plans[pday][1].push(['新動作','8–12',3]))">＋ 新增課表動作</button><div class="panel"><h3>資料備份</h3><button class="wide" onclick="backup()">匯出 JSON 備份</button><label>匯入備份（取代現有資料）</label><input type="file" accept=".json" onchange="restore(this.files[0])"><p class="muted">請定期匯出備份。雲端同步狀態顯示於頁首。</p></div>`}document.querySelector('#app').innerHTML=h}function plan(i,k,v){data.plans[pday][1][i][k]=v;persist();syncPlans()}
let session=null;const base='https://kqbetxiaeuaecxxudapa.supabase.co',key='sb_publishable_9iTJFm66hUynWX4QM_9geQ_a3qbwsC0';
const status=t=>document.getElementById('cloudStatus').textContent=t;
async function req(path,method='GET',body,prefer='return=representation'){let r=await fetch(base+path,{method,headers:{apikey:key,Authorization:'Bearer '+(session?.access_token||key),'Content-Type':'application/json',Prefer:prefer},...(body===undefined?{}:{body:JSON.stringify(body)})});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
const db=(t,q='',m='GET',b,p)=>req('/rest/v1/'+t+q,m,b,p);
async function login(signup){try{let email=document.getElementById('email').value,password=document.getElementById('password').value;let r=await req('/auth/v1/'+(signup?'signup':'token?grant_type=password'),'POST',{email,password});if(!r.access_token){status('請確認驗證信後再登入');return}session=r;await load()}catch(e){status('登入失敗：'+e.message)}}
function logout(){session=null;location.reload()}
function toggleTheme(){document.body.classList.toggle('light');if(session)db('preferences','?on_conflict=user_id','POST',{user_id:session.user.id,theme:document.body.classList.contains('light')?'light':'dark'},'resolution=merge-duplicates').catch(e=>status('主題同步失敗'))}
async function load(){try{let [p,w,sets,weights,prefs]=await Promise.all(['plans','workouts','workout_sets','body_measurements','preferences'].map(t=>db(t)));data={plans:clone(defaults),history:[],weights,draft:null};p.forEach(x=>data.plans[x.day-1]=[x.name,x.exercises]);data.history=w.map(x=>{let es=[];sets.filter(y=>y.workout_id===x.id).sort((a,b)=>a.exercise_order-b.exercise_order||a.set_number-b.set_number).forEach(y=>{let e=es.find(z=>z.order===y.exercise_order);if(!e){e={order:y.exercise_order,name:y.exercise_name,equipment:y.equipment_name||'',unit:y.count_unit==='trips'?'趟':({bodyweight:'自體重量',assisted:'輔助重量'}[y.unit]||y.unit),target:'',sets:[]};es.push(e)}e.sets.push({w:String(y.weight??''),r:String(y.reps??''),rir:String(y.rir??'')})});return {id:x.id,date:x.workout_date,day:x.day-1,gym:x.gym_name||'',note:x.notes||'',ex:es}});data.draft=fresh(0);if(prefs[0]?.theme==='light')document.body.classList.add('light');document.getElementById('login').hidden=true;document.getElementById('nav').hidden=false;document.getElementById('app').hidden=false;status('已登入・雲端資料已載入');render();if(!p.length)await syncPlans()}catch(e){status('載入失敗：'+e.message)}}
async function syncPlans(){if(!session)return;try{await db('plans','?on_conflict=user_id,day','POST',data.plans.map((p,i)=>({user_id:session.user.id,day:i+1,name:p[0],exercises:p[1]})),'resolution=merge-duplicates');status('課表已同步')}catch(e){status('課表同步失敗：'+e.message)}}
async function syncWorkout(d){try{if(!/^[0-9a-f-]{36}$/i.test(d.id)){let old=d.id;d.id=crypto.randomUUID();let h=data.history.find(x=>x.id===old);if(h)h.id=d.id}await db('workouts','?on_conflict=id','POST',{id:d.id,day:d.day+1,workout_date:d.date,gym_name:d.gym,notes:d.note},'resolution=merge-duplicates');let rows=d.ex.flatMap((e,i)=>e.sets.map((s,j)=>({workout_id:d.id,exercise_name:e.name,exercise_order:i+1,set_number:j+1,equipment_name:e.equipment||null,unit:({自體重量:'bodyweight',輔助重量:'assisted',趟:'kg'}[e.unit]||e.unit),count_unit:e.unit==='趟'?'trips':'reps',weight:s.w===''?null:Number(s.w),reps:s.r===''?null:Number(s.r),rir:s.rir===''?null:Number(s.rir)})));if(rows.some(r=>[r.weight,r.reps,r.rir].some(v=>v!==null&&(!Number.isFinite(v)||v<0))||r.reps!==null&&!Number.isInteger(r.reps)))throw Error('請檢查重量、次數及 RIR');await db('workout_sets','?workout_id=eq.'+d.id,'DELETE');if(rows.length)await db('workout_sets','','POST',rows);status('訓練已同步');persist()}catch(e){status('同步失敗，請保留草稿並重試：'+e.message);alert('同步失敗，請重試')}}
async function deleteWorkout(i){try{await db('workouts','?id=eq.'+data.history[i].id,'DELETE');data.history.splice(i,1);render();status('已刪除')}catch(e){status('刪除失敗')}}
function weightPage(){let a=[...data.weights].sort((a,b)=>a.measurement_date.localeCompare(b.measurement_date));let vals=a.map(x=>Number(x.weight_kg)),lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5;return `<h2>體重紀錄</h2><label>日期</label><input id="wd" type="date" value="${today()}"><label>體重 kg</label><input id="wv" type="number" min="0.1" step="0.1"><button class="primary wide" onclick="addWeight()">儲存體重</button>${a.length?`<svg viewBox="0 0 300 120" width="100%"><polyline fill="none" stroke="#65a984" stroke-width="2" points="${vals.map((v,i)=>`${10+i*280/Math.max(1,vals.length-1)},${110-(v-lo)/(hi-lo)*100}`).join(' ')}"/></svg>`:''}${a.map(x=>`<div class="panel">${esc(x.measurement_date)}　${esc(x.weight_kg)} kg <button onclick="removeWeight('${x.id}')">刪除</button></div>`).join('')}`}
async function addWeight(){try{let v=Number(document.getElementById('wv').value),d=document.getElementById('wd').value;if(!d||!Number.isFinite(v)||v<=0)throw Error('請填正確體重');let r=await db('body_measurements','','POST',{measurement_date:d,weight_kg:v});data.weights.push(...r);render();status('體重已同步')}catch(e){status(e.message)}}
async function removeWeight(id){if(!confirm('刪除此體重？'))return;try{await db('body_measurements','?id=eq.'+id,'DELETE');data.weights=data.weights.filter(x=>x.id!==id);render()}catch(e){status('刪除失敗')}}
document.getElementById('nav').hidden=true;document.getElementById('app').hidden=true;
</script></html>
